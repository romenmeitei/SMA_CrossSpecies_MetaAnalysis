[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sma-xspecies"
version = "1.0.0"
description = "Tissue-aware cross-species and treatment-reversal meta-analysis for spinal muscular atrophy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "networkx>=3.2,<4",
]

[project.optional-dependencies]
enrichment = ["gseapy>=1.1,<2"]
notebook = ["jupyter>=1.0,<2", "nbformat>=5.9,<6"]
test = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[project.scripts]
sma-xspecies = "sma_xspecies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
